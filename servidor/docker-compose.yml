services:
  db:
    image: postgres:16
    container_name: monitor_db
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: cambia-esta-clave
      POSTGRES_DB: examenes
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # crea las tablas al arrancar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d examenes"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: monitor_web
    environment:
      DATABASE_URL: postgresql://monitor:cambia-esta-clave@db:5432/examenes
      INGEST_TOKEN: pon-un-token-largo-y-secreto      # el cliente debe mandar este mismo
      PANEL_USER: profe
      PANEL_PASSWORD: clave-del-panel                 # para entrar al panel web
      ALERTA_SEG: "900"                               # 15 min sin teclear -> resalte amarillo
      ABANDONO_SEG: "14400"                           # 4 h sin señal -> captura 'caida'
    ports:
      - "127.0.0.1:8000:8000"       # panel e ingesta en http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
